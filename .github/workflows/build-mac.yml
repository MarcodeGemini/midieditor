name: Build macOS App

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt 5
        run: brew install qt@5

      - name: Compile MidiEditor
        run: |
          export PATH="$(brew --prefix qt@5)/bin:$PATH"
          sh building/build-mac.sh
          
      - name: Bundle Dependencies and Create DMG
        run: |
          export PATH="$(brew --prefix qt@5)/bin:$PATH"
          # The -dmg flag creates a proper Mac disk image
          macdeployqt MidiEditor.app -dmg
          
      - name: Upload Packaged Mac App
        uses: actions/upload-artifact@v4
        with:
          name: MidiEditor-Mac-Installer
          # Upload the DMG file instead of the raw folder
          path: MidiEditor.dmg
