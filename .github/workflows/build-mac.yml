name: Build macOS App

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt 5
        run: brew install qt@5

      - name: Compile MidiEditor
        run: |
          export PATH="$(brew --prefix qt@5)/bin:$PATH"
          sh building/build-mac.sh
          
      - name: Bundle Dependencies, Sign, and Create DMG
        run: |
          export PATH="$(brew --prefix qt@5)/bin:$PATH"
          
          # 1. Bundle all the Qt libraries into the app
          macdeployqt MidiEditor.app
          
          # 2. Ad-hoc sign the app and all its contents so Apple Silicon accepts it
          codesign --force --deep --sign - MidiEditor.app
          
          # 3. Create the DMG disk image manually
          hdiutil create -volname "MidiEditor" -srcfolder MidiEditor.app -ov -format UDZO MidiEditor.dmg
          
      - name: Upload Packaged Mac App
        uses: actions/upload-artifact@v4
        with:
          name: MidiEditor-Mac-Installer
          path: MidiEditor.dmg
