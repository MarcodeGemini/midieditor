name: Build macOS App

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt 5
        run: brew install qt@5

      - name: Compile MidiEditor
        run: |
          # Link Qt to the path and run the existing build script
          export PATH="$(brew --prefix qt@5)/bin:$PATH"
          sh building/build-mac.sh
          
      - name: Bundle Dependencies (macdeployqt)
        run: |
          # Run the deployment tool on the freshly built app bundle
          export PATH="$(brew --prefix qt@5)/bin:$PATH"
          macdeployqt MidiEditor.app
          
      - name: Upload Packaged Mac App
        uses: actions/upload-artifact@v4
        with:
          name: MidiEditor-MacApp
          path: MidiEditor.app
